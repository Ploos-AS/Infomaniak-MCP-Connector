name: Go CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Check dependency lockfile
        run: git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run tests
        run: go test ./...
      - name: Build
        run: go build -o /tmp/infomaniak-mcp ./cmd/infomaniak-mcp
